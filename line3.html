<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>リアルに転がるシャー芯（iPad / iPhone補正版）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: fixed; /* iOSのスクロール・バウンスを強制防止 */
      touch-action: none;
      cursor: pointer;
    }

    /* 物理描画層 */
    .viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 10;
    }

    .target-line {
      width: 220px;
      height: 1px;
      background-color: #111111;
      box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.2);
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: center center;
      backface-visibility: hidden;
      will-change: transform;
    }

    .guide-notice {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.08);
      color: #333;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="guide-notice" id="guideNotice">画面をタップしてセンサーとサウンドを有効化</div>

  <div class="viewport" id="viewport">
    <div class="target-line" id="line"></div>
  </div>

  <script>
    const line = document.getElementById('line');
    const viewport = document.getElementById('viewport');
    const guideNotice = document.getElementById('guideNotice');

    const lineLength = 220;
    let posX = window.innerWidth / 2;
    let posY = window.innerHeight / 2;
    let vx = 0;
    let vy = 0;
    let angle = 0;
    let angularVel = 0;

    let tiltX = 0;
    let tiltY = 0;

    const friction = 0.92;
    const baseSensitivity = 0.001;
    const exponent = 2.2;
    const staticThreshold = 1.5;

    // --- Web Audio API（効果音用）---
    let audioCtx = null;
    let isAudioUnlocked = false;

    function initAudio() {
      if (isAudioUnlocked) return;
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      // 無音再生でiOSのガードを通過
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);

      isAudioUnlocked = true;
    }

    function calculateExponentialForce(tilt) {
      const absTilt = Math.abs(tilt);
      if (absTilt <= staticThreshold) return 0;
      const force = Math.pow(absTilt - staticThreshold, exponent) * baseSensitivity;
      return Math.sign(tilt) * force;
    }

    function animate() {
      const screenW = viewport.clientWidth;
      const screenH = viewport.clientHeight;

      const forceX = calculateExponentialForce(tiltX);
      const forceY = calculateExponentialForce(tiltY);

      vx += forceX;
      vy += forceY;
      vx *= friction;
      vy *= friction;

      const speed = Math.hypot(vx, vy);
      if (speed > 0.05) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const cross = cos * vy - sin * vx;
        angularVel += cross * 0.002;
      }

      angularVel *= 0.72;
      angle += angularVel;

      posX += vx;
      posY += vy;

      const margin = 120;
      const minX = -margin;
      const maxX = screenW + margin;
      const minY = -margin;
      const maxY = screenH + margin;

      if (posX < minX) { posX = minX; vx = 0; }
      if (posX > maxX) { posX = maxX; vx = 0; }
      if (posY < minY) { posY = minY; vy = 0; }
      if (posY > maxY) { posY = maxY; vy = 0; }

      const drawX = Math.round(posX - lineLength / 2);
      const drawY = Math.round(posY);
      const drawAngle = Math.round(angle * 100) / 100;

      line.style.transform = `translate3d(${drawX}px, ${drawY}px, 0px) rotate(${drawAngle}rad)`;

      requestAnimationFrame(animate);
    }

    // --- iPad / iPhone 傾きセンサーの上下左右正しく補正する処理 ---
    function handleOrientation(event) {
      if (event.gamma !== null && event.beta !== null) {
        let g = event.gamma; // 左右の傾き (-90 〜 90)
        let b = event.beta;  // 前後の傾き (-180 〜 180)

        // 画面の向きを取得 (0: 縦, 90: 横時計回り, -90: 横反時計回り, 180: 逆さ縦)
        const orientation = window.orientation || (screen.orientation && screen.orientation.angle) || 0;

        switch (orientation) {
          case 90: // iPad等の横持ち（右回転）
            tiltX = b;
            tiltY = -g;
            break;
          case -90: // iPad等の横持ち（左回転）
            tiltX = -b;
            tiltY = g;
            break;
          case 180: // 逆さ縦持ち
            tiltX = -g;
            tiltY = -b;
            break;
          default: // 通常の縦持ち (0)
            tiltX = g;
            tiltY = b;
            break;
        }

        tiltX = Math.max(-45, Math.min(45, tiltX));
        tiltY = Math.max(-45, Math.min(45, tiltY));
      }
    }

    // センサー・音声の初回アンロック機能
    function enableSensors() {
      initAudio();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
              if (guideNotice) guideNotice.style.display = 'none';
            }
          })
          .catch(() => {});
      } else if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', handleOrientation, true);
        if (guideNotice) guideNotice.style.display = 'none';
      }
    }

    window.addEventListener('click', enableSensors, { once: true });
    window.addEventListener('touchstart', enableSensors, { once: true });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
