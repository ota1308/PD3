<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>iPhone対応 触覚・階層体験（完全ズーム防止版）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed; /* 画面のスクロール・バウンスを強制防止 */
      background-color: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    .viewport {
      position: relative;
      width: 300px;
      height: 440px;
      perspective: 1000px;
    }

    .layer {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      touch-action: none;
    }

    /* 深層（奥のレイヤー） */
    .layer-deep {
      background: #18002e;
      border: 2px solid #a855f7;
      color: #a855f7;
      transform: translateZ(-120px);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
    }

    /* 浅層（手前のカード） */
    .layer-surface {
      background: #f4f4f0;
      border: 2px solid #111;
      color: #111;
      z-index: 2;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      will-change: transform;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .desc {
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.8;
      margin-top: 10px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      background: #111;
      color: #fff;
      width: fit-content;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .layer-deep .badge {
      background: #a855f7;
      color: #fff;
    }

    .notice {
      position: absolute;
      bottom: -35px;
      left: 0;
      right: 0;
      text-align: center;
      color: #666;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="layer layer-deep" id="layerDeep">
      <div>
        <div class="title">LAYER 02 : DEEP</div>
        <p class="desc">
          【破断完了】<br>
          層の境界線を突破しました。<br>
          引っ張る重さが変化した感触が得られます。
        </p>
      </div>
      <div class="badge">ZONE: HEAVY</div>
    </div>

    <div class="layer layer-surface" id="layerSurface">
      <div>
        <div class="title">PULL DOWN (iOS READY)</div>
        <p class="desc">
          ゆっくり下に引っ張ってください。<br>
          途中で手ごたえ（引き伸ばしの重さ）が変化し、カチッと奥の層へハマる疑似触覚を再現しています。
        </p>
      </div>
      <div class="badge" id="statusBadge">DEPTH: 0px</div>
    </div>

    <div class="notice">※ 音が出ない場合はマナーモードを解除してください</div>
  </div>

  <script>
    const surface = document.getElementById('layerSurface');
    const deep = document.getElementById('layerDeep');
    const badge = document.getElementById('statusBadge');

    let startY = 0;
    let isDragging = false;
    let hasCrossed = false;

    // Web Audio APIの初期化
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playMechanicalSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        if (type === 'break') {
          // ガチッ（ノコギリ波：高音量）
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.06);

          gain.gain.setValueAtTime(0.5, now); // 音量をアップ
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.06);

        } else if (type === 'light') {
          // チッ（矩形波）
          osc.type = 'square';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.03);

          gain.gain.setValueAtTime(0.2, now); // 音量をアップ
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.03);
        }
      } catch (e) {}
    }

    function onPointerDown(e) {
      initAudio(); // タップした瞬間にAudioを復帰
      isDragging = true;

      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      startY = clientY;

      surface.style.transition = 'none';
      deep.style.transition = 'none';
    }

    function onPointerMove(e) {
      if (!isDragging) return;

      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const rawDeltaY = Math.max(0, clientY - startY);

      let renderY = 0;
      const THRESHOLD = 110;

      if (rawDeltaY < THRESHOLD) {
        renderY = rawDeltaY;
        badge.textContent = `DEPTH: ${Math.round(renderY)}px (LIGHT)`;
        badge.style.background = '#111';

        if (hasCrossed) {
          hasCrossed = false;
          playMechanicalSound('light');
        }
      } else {
        const overDistance = rawDeltaY - THRESHOLD;
        renderY = THRESHOLD + Math.pow(overDistance, 0.65);
        
        badge.textContent = `DEPTH: ${Math.round(renderY)}px (HEAVY)`;
        badge.style.background = '#a855f7';

        if (!hasCrossed) {
          hasCrossed = true;
          playMechanicalSound('break');
        }
      }

      surface.style.transform = `translateY(${renderY}px) scale(${1 - renderY * 0.0006})`;
      deep.style.transform = `translateZ(${-120 + renderY * 0.6}px) scale(${0.88 + renderY * 0.0006})`;
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;

      surface.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.25)';
      deep.style.transition = 'transform 0.4s ease';

      surface.style.transform = 'translateY(0px) scale(1)';
      deep.style.transform = 'translateZ(-120px) scale(1)';

      badge.textContent = 'DEPTH: 0px';
      badge.style.background = '#111';

      if (hasCrossed) {
        playMechanicalSound('light');
      }
      hasCrossed = false;
    }

    // イベント登録（PointerEvents & TouchEvents）
    surface.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    surface.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
  </script>
</body>
</html>
