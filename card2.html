<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPhone対応 触覚・階層体験（完全動作版）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .viewport {
      position: relative;
      width: 320px;
      height: 460px;
      perspective: 1000px;
    }

    .layer {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      touch-action: none;
    }

    /* 深層（奥のレイヤー） */
    .layer-deep {
      background: #18002e;
      border: 2px solid #a855f7;
      color: #a855f7;
      transform: translateZ(-120px);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
    }

    /* 浅層（手前のカード） */
    .layer-surface {
      background: #f4f4f0;
      border: 2px solid #111;
      color: #111;
      z-index: 2;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      will-change: transform;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .desc {
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.8;
      margin-top: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      background: #111;
      color: #fff;
      width: fit-content;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .layer-deep .badge {
      background: #a855f7;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="layer layer-deep" id="layerDeep">
      <div>
        <div class="title">LAYER 02 : DEEP</div>
        <p class="desc">
          【破断完了】<br>
          層の境界線を突破しました。<br>
          引っ張る重さが変化した感触が得られます。
        </p>
      </div>
      <div class="badge">ZONE: HEAVY</div>
    </div>

    <div class="layer layer-surface" id="layerSurface">
      <div>
        <div class="title">PULL DOWN (iOS READY)</div>
        <p class="desc">
          ゆっくり下に引っ張ってください。<br>
          途中で手ごたえ（引き伸ばしの重さ）が変化し、カチッと奥の層へハマる疑似触覚を再現しています。
        </p>
      </div>
      <div class="badge" id="statusBadge">DEPTH: 0px</div>
    </div>
  </div>

  <script>
    const surface = document.getElementById('layerSurface');
    const deep = document.getElementById('layerDeep');
    const badge = document.getElementById('statusBadge');

    let startY = 0;
    let isDragging = false;
    let hasCrossed = false;

    // Web Audio APIによる機械音（メカニカル・クリック）
    let audioCtx = null;

    function playMechanicalSound(type) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        if (type === 'break') {
          // 重厚な「ガチッ」という低音ラチェット音（ノコギリ波）
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.05);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.05);

        } else if (type === 'light') {
          // 軽快な「チッ」というスイッチ音（矩形波）
          osc.type = 'square';
          osc.frequency.setValueAtTime(750, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.02);

          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.02);
        }
      } catch (e) {}
    }

    function onPointerDown(e) {
      isDragging = true;
      startY = e.pageY || (e.touches ? e.touches[0].pageY : 0);
      surface.style.transition = 'none';
      deep.style.transition = 'none';
      
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function onPointerMove(e) {
      if (!isDragging) return;

      const pageY = e.pageY || (e.touches ? e.touches[0].pageY : 0);
      const rawDeltaY = Math.max(0, pageY - startY);

      let renderY = 0;
      const THRESHOLD = 110; // 境界線

      if (rawDeltaY < THRESHOLD) {
        // 1. 浅い層：指の動きに素直に追従
        renderY = rawDeltaY;
        badge.textContent = `DEPTH: ${Math.round(renderY)}px (LIGHT)`;
        badge.style.background = '#111';

        if (hasCrossed) {
          hasCrossed = false;
          playMechanicalSound('light'); // 戻った時の「チッ」という音
        }
      } else {
        // 2. 境界突破：指の動きに対してブレーキ（重さ）がかかる
        const overDistance = rawDeltaY - THRESHOLD;
        renderY = THRESHOLD + Math.pow(overDistance, 0.65);
        
        badge.textContent = `DEPTH: ${Math.round(renderY)}px (HEAVY)`;
        badge.style.background = '#a855f7';

        if (!hasCrossed) {
          hasCrossed = true;
          playMechanicalSound('break'); // 突破時の「ガチッ」という音
        }
      }

      // ビジュアル連動
      surface.style.transform = `translateY(${renderY}px) scale(${1 - renderY * 0.0006})`;
      deep.style.transform = `translateZ(${-120 + renderY * 0.6}px) scale(${0.88 + renderY * 0.0006})`;
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;

      // バネのような弾性で元に戻る
      surface.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.25)';
      deep.style.transition = 'transform 0.4s ease';

      surface.style.transform = 'translateY(0px) scale(1)';
      deep.style.transform = 'translateZ(-120px) scale(1)';

      badge.textContent = 'DEPTH: 0px';
      badge.style.background = '#111';

      if (hasCrossed) {
        playMechanicalSound('light');
      }
      hasCrossed = false;
    }

    // タッチ＆マウスイベント
    surface.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    surface.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
  </script>
</body>
</html>
