<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPhone対応 メカニカル触覚体験</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .viewport {
      position: relative;
      width: 320px;
      height: 460px;
      perspective: 1000px;
    }

    .layer {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      touch-action: none;
    }

    /* 深層（奥のレイヤー） */
    .layer-deep {
      background: #0f172a;
      border: 2px solid #38bdf8;
      color: #38bdf8;
      transform: translateZ(-120px);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
    }

    /* 浅層（手前のカード） */
    .layer-surface {
      background: #f4f4f0;
      border: 2px solid #111;
      color: #111;
      z-index: 2;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      will-change: transform;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .desc {
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.8;
      margin-top: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      background: #111;
      color: #fff;
      width: fit-content;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .layer-deep .badge {
      background: #38bdf8;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="layer layer-deep" id="layerDeep">
      <div>
        <div class="title">LAYER 02 : MECHANICAL</div>
        <p class="desc">
          【ロック解除】<br>
          層のラチェット機構を通過しました。<br>
          機械的な衝撃音と抵抗が発生しています。
        </p
