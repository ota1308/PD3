<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルに転がる髪の毛</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      cursor: pointer;
    }

    /* 物理描画層 */
    .viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 10;
    }

    /* 髪の毛要素のコンテナ */
    .target-hair {
      width: 180px;
      height: 30px;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: center center;
      backface-visibility: hidden;
      pointer-events: none;
      filter: drop-shadow(0px 1px 1px rgba(0, 0, 0, 0.15));
    }

    /* 髪の毛を描くSVG */
    .target-hair svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div class="viewport" id="viewport">
    <div class="target-hair" id="line">
      <!-- 自然なうねりと先細りを持つ髪の毛のSVGパス -->
      <svg viewBox="0 0 180 30" preserveAspectRatio="none">
        <path d="M 5,20 Q 40,5 90,15 T 175,10 C 177,10.2 177,10.8 175,11 Q 130,22 90,17 T 5,21 Z" fill="#1a1a1a" />
      </svg>
    </div>
  </div>

  <script>
    const line = document.getElementById('line');
    const viewport = document.getElementById('viewport');

    const hairWidth = 180;
    let posX = viewport.clientWidth / 2;
    let posY = viewport.clientHeight / 2;
    let vx = 0;
    let vy = 0;
    let angle = 0;
    let angularVel = 0;

    let tiltX = 0;
    let tiltY = 0;

    const friction = 0.92;
    const baseSensitivity = 0.001;
    const exponent = 2.2;
    const staticThreshold = 1.5;

    function calculateExponentialForce(tilt) {
      const absTilt = Math.abs(tilt);
      if (absTilt <= staticThreshold) return 0;
      const force = Math.pow(absTilt - staticThreshold, exponent) * baseSensitivity;
      return Math.sign(tilt) * force;
    }

    function animate() {
      const screenW = viewport.clientWidth;
      const screenH = viewport.clientHeight;

      const forceX = calculateExponentialForce(tiltX);
      const forceY = calculateExponentialForce(tiltY);

      vx += forceX;
      vy += forceY;
      vx *= friction;
      vy *= friction;

      const speed = Math.hypot(vx, vy);
      if (speed > 0.05) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const cross = cos * vy - sin * vx;
        angularVel += cross * 0.002;
      }

      angularVel *= 0.72;
      angle += angularVel;

      posX += vx;
      posY += vy;

      const margin = 120;
      const minX = -margin;
      const maxX = screenW + margin;
      const minY = -margin;
      const maxY = screenH + margin;

      if (posX < minX) { posX = minX; vx = 0; }
      if (posX > maxX) { posX = maxX; vx = 0; }
      if (posY < minY) { posY = minY; vy = 0; }
      if (posY > maxY) { posY = maxY; vy = 0; }

      const drawX = Math.round(posX - hairWidth / 2);
      const drawY = Math.round(posY - 15);
      const drawAngle = Math.round(angle * 100) / 100;

      line.style.transform = `translate3d(${drawX}px, ${drawY}px, 0px) rotate(${drawAngle}rad)`;

      requestAnimationFrame(animate);
    }

    function handleOrientation(event) {
      if (event.gamma !== null && event.beta !== null) {
        let g = event.gamma;
        let b = event.beta;

        const orientation = window.orientation || (screen.orientation && screen.orientation.angle) || 0;
        if (orientation === 90) {
          tiltX = -b;
          tiltY = g;
        } else if (orientation === -90) {
          tiltX = b;
          tiltY = -g;
        } else {
          tiltX = g;
          tiltY = b;
        }

        tiltX = Math.max(-45, Math.min(45, tiltX));
        tiltY = Math.max(-45, Math.min(45, tiltY));
      }
    }

    function enableSensor() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
            }
          })
          .catch(() => {});
      } else if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    window.addEventListener('click', enableSensor, { once: true });
    window.addEventListener('touchstart', enableSensor, { once: true });
    requestAnimationFrame(animate);
  </script>
</body>
</html>
